<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #0E0C0A; --bg2: #161310; --bg3: #1E1A16; --surface: #231F1B;
  --border: rgba(255,255,255,0.08); --border2: rgba(255,255,255,0.14);
  --text: #F0EBE4; --muted: #B8AFA7; --accent: #C17D4A;
  --accent-light: rgba(193,125,74,0.15);
}
html { scroll-behavior: smooth; }
body { background: var(--bg); color: var(--text); font-family: 'DM Sans', sans-serif; line-height: 1.7; min-height: 100vh; }

nav {
  position: fixed; top: 0; left: 0; right: 0; z-index: 100;
  display: flex; align-items: center; justify-content: space-between;
  padding: 1rem 2rem;
  background: rgba(14,12,10,0.92); backdrop-filter: blur(16px);
  border-bottom: 0.5px solid var(--border);
}
.nav-logo { font-family: 'Playfair Display', serif; font-size: 20px; font-weight: 700; color: var(--text); text-decoration: none; }
.nav-logo span { color: var(--accent); font-style: italic; }
.nav-right { display: flex; align-items: center; gap: 1.5rem; }
.nav-back { font-size: 14px; color: var(--muted); text-decoration: none; transition: color 0.2s; }
.nav-back:hover { color: var(--accent); }

/* AD BANNER */
.ad-banner { background: var(--bg2); border-top: 0.5px solid var(--border); border-bottom: 0.5px solid var(--border); padding: 0.75rem 2rem; text-align: center; }
.ad-inner { max-width: 728px; margin: 0 auto; height: 56px; border: 1.5px dashed rgba(193,125,74,0.25); border-radius: 8px; display: flex; align-items: center; justify-content: center; gap: 10px; }
.ad-inner span { font-size: 13px; color: var(--muted); }
.ad-badge { font-size: 10px; padding: 3px 10px; border-radius: 100px; background: var(--accent-light); color: var(--accent); font-weight: 500; letter-spacing: 0.05em; text-transform: uppercase; flex-shrink: 0; }

/* PAGE WRAP */
.page-wrap { max-width: 860px; margin: 0 auto; padding: 7rem 2rem 5rem; }

/* HEADER */
.page-header { margin-bottom: 3rem; }
.page-label { font-size: 11px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--accent); font-weight: 500; margin-bottom: 0.75rem; }
.page-title { font-family: 'Playfair Display', serif; font-size: clamp(2rem, 5vw, 3rem); font-weight: 700; line-height: 1.15; margin-bottom: 0.75rem; }
.page-title em { font-style: italic; color: var(--accent); }
.page-desc { font-size: 16px; color: var(--muted); max-width: 520px; line-height: 1.7; }

/* ARTICLE LIST */
.artikel-list { display: flex; flex-direction: column; gap: 0; }

.artikel-item {
  display: flex; align-items: flex-start; gap: 1.25rem;
  padding: 1.5rem 0;
  border-bottom: 0.5px solid var(--border);
  text-decoration: none; color: inherit;
  transition: all 0.2s;
}
.artikel-item:first-child { border-top: 0.5px solid var(--border); }
.artikel-item:hover .artikel-item-title { color: var(--accent); }
.artikel-item:hover .artikel-item-arrow { transform: translateX(4px); opacity: 1; }

.artikel-item-icon {
  font-size: 2rem;
  width: 52px; height: 52px;
  background: var(--surface);
  border: 0.5px solid var(--border);
  border-radius: 12px;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
  transition: border-color 0.2s;
}
.artikel-item:hover .artikel-item-icon { border-color: var(--accent); }

.artikel-item-body { flex: 1; min-width: 0; }
.artikel-item-meta { font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--accent); font-weight: 500; margin-bottom: 0.3rem; }
.artikel-item-title { font-family: 'Playfair Display', serif; font-size: 1.15rem; font-weight: 700; line-height: 1.3; margin-bottom: 0.4rem; transition: color 0.2s; }
.artikel-item-spill { font-size: 14px; color: var(--muted); line-height: 1.6; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.artikel-item-date { font-size: 12px; color: rgba(184,175,167,0.45); margin-top: 0.4rem; }

.artikel-item-arrow {
  font-size: 18px; color: var(--accent);
  flex-shrink: 0; margin-top: 2px;
  transition: transform 0.2s, opacity 0.2s;
  opacity: 0.4;
}

/* EMPTY STATE */
.empty-state { text-align: center; padding: 4rem 2rem; color: var(--muted); }
.empty-state .emoji { font-size: 48px; margin-bottom: 1rem; }
.empty-state p { font-size: 15px; }

/* PAGINATION */
.pagination { display: flex; align-items: center; justify-content: center; gap: 8px; margin-top: 3rem; flex-wrap: wrap; }
.page-btn {
  width: 40px; height: 40px; border-radius: 10px;
  border: 0.5px solid var(--border2);
  background: transparent; color: var(--muted);
  font-family: 'DM Sans', sans-serif; font-size: 14px; font-weight: 500;
  cursor: pointer; transition: all 0.2s;
  display: flex; align-items: center; justify-content: center;
}
.page-btn:hover { border-color: var(--accent); color: var(--accent); }
.page-btn.active { background: var(--accent); color: white; border-color: var(--accent); }
.page-btn:disabled { opacity: 0.3; cursor: not-allowed; }
.page-btn.arrow { font-size: 16px; }
.page-info { font-size: 13px; color: var(--muted); padding: 0 8px; }

/* FLOAT BTNS */
.float-btns { position: fixed; bottom: 24px; right: 24px; z-index: 9999; display: flex; flex-direction: column; gap: 10px; align-items: flex-end; }
.float-btn { display: flex; align-items: center; gap: 8px; padding: 10px 16px; border-radius: 100px; font-family: 'DM Sans', sans-serif; font-size: 13px; font-weight: 500; text-decoration: none; cursor: pointer; border: none; box-shadow: 0 4px 16px rgba(0,0,0,0.4); white-space: nowrap; }
.float-btn-donate { background: var(--accent); color: white; }
.float-btn-bug { background: var(--surface); color: var(--muted); border: 0.5px solid var(--border2); }

@keyframes fadeUp { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
@media (max-width: 600px) {
  .page-wrap { padding-left: 1.25rem; padding-right: 1.25rem; }
  .artikel-item-icon { width: 44px; height: 44px; font-size: 1.6rem; }
}
</style>
</head>
<body>

<nav>
  <a class="nav-logo" href="index.html">Kenapa<span>Gw</span></a>
  <div class="nav-right">

  </div>

<div class="ad-banner">
  <div class="ad-inner">

  </div>
</div>

<div class="page-wrap">
  <div class="page-header">
    <p class="page-label">Berita Unik · Kategori</p>
    <h1 class="page-title">🧪 <em>Sains</em></h1>
    <p class="page-desc">Penemuan-penemuan ilmiah yang bikin kamu ngerasa kecil tapi penasaran banget.</p>

    <span class="ad-badge">Iklan</span>
    <span>Tertarik pasang iklan? Kirim email ke akunlmpodcast@gmail.com</span>
  </div>
</div>

<div class="float-btns">
  <a class="float-btn float-btn-donate" href="https://wa.me/6285283291239?text=Halo%20KenapaGw!%20Saya%20mau%20donasi%20%F0%9F%92%9B" target="_blank">💛 Donate</a>
  <a class="float-btn float-btn-bug" href="mailto:akunlmpodcast@gmail.com?subject=Bug%20Report%20-%20KenapaGw">🐛 Report Bug</a>
</div>

<script>
// ── DATA ARTIKEL ──────────────────────────────────────────────────────────────
// Tambah artikel baru di sini. Maks 10 per halaman, auto pagination.
const artikelSains = [
  {
    id: 'lautan-bumi',
    icon: '🌍💧',
    judul: 'Lautan Tersembunyi di Dalam Perut Bumi',
    spill: 'Jauh di bawah kaki kita, tersembunyi cadangan air dalam jumlah luar biasa besar di dalam mantel Bumi — bukan lautan biasa, tapi air yang terperangkap dalam mineral di kedalaman ratusan kilometer.',
    tanggal: '17 Mei 2026',
    url: 'lautan-bumi.html',
  },
  // Tambah artikel baru di bawah ini dengan format yang sama:
  // {
  //   id: 'nama-id-unik',
  //   icon: '🔬',
  //   judul: 'Judul Artikel',
  //   spill: 'Kalimat pembuka singkat yang bikin penasaran...',
  //   tanggal: 'DD Bulan YYYY',
  //   url: 'nama-file.html',
  // },
];

// ── PAGINATION CONFIG ─────────────────────────────────────────────────────────
const PER_PAGE = 10;
let currentPage = 1;

function render() {
  const list = document.getElementById('artikelList');
  const paginationEl = document.getElementById('pagination');
  const totalPages = Math.max(1, Math.ceil(artikelSains.length / PER_PAGE));
  const start = (currentPage - 1) * PER_PAGE;
  const pageItems = artikelSains.slice(start, start + PER_PAGE);

  // Render articles
  if (artikelSains.length === 0) {
    list.innerHTML = `<div class="empty-state"><div class="emoji">🔬</div><p>Belum ada artikel di kategori ini.<br>Nantikan konten baru segera!</p></div>`;
  } else {
    list.innerHTML = pageItems.map(a => `
      <a class="artikel-item" href="${a.url}">
        <div class="artikel-item-icon">${a.icon}</div>
        <div class="artikel-item-body">
          <p class="artikel-item-meta">Sains · ${a.tanggal}</p>
          <h2 class="artikel-item-title">${a.judul}</h2>
          <p class="artikel-item-spill">${a.spill}</p>
        </div>
        <span class="artikel-item-arrow">→</span>
      </a>
    `).join('');
  }

  // Render pagination (only if >1 page)
  if (totalPages <= 1) { paginationEl.innerHTML = ''; return; }

  let btns = '';
  btns += `<button class="page-btn arrow" onclick="goPage(${currentPage - 1})" ${currentPage === 1 ? 'disabled' : ''}>‹</button>`;
  for (let i = 1; i <= totalPages; i++) {
    btns += `<button class="page-btn ${i === currentPage ? 'active' : ''}" onclick="goPage(${i})">${i}</button>`;
  }
  btns += `<button class="page-btn arrow" onclick="goPage(${currentPage + 1})" ${currentPage === totalPages ? 'disabled' : ''}>›</button>`;
  btns += `<span class="page-info">Halaman ${currentPage} dari ${totalPages}</span>`;
  paginationEl.innerHTML = btns;
}

function goPage(n) {
  const totalPages = Math.ceil(artikelSains.length / PER_PAGE);
  if (n < 1 || n > totalPages) return;
  currentPage = n;
  render();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

render();
</script>
